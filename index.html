<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="bookshelf">

    </div>
    <dialog id="book-modal">
        <form method="dialog">
            <span class="title"><span contenteditable></span></span>
            <span class="author">by <span contenteditable></span></span>
            <span class="page-count"> <span contenteditable></span> pages</span>
            <span class="is-read"></span></span>
            <button>Save</button>
        </form>
    </dialog>
</body>
</html>
